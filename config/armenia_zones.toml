# Zonas de domicilio de Armenia — barrio → zona de tarifa.
#
# El bot NO deduce la zona de una dirección. Antes de esta tabla, el modelo leía
# "Barrio Granada" y adivinaba: el 2026-08-30 dijo "zona norte" y cobró $6.000,
# el 2026-09-18 dijo centro y cobró $8.000 — misma dirección, mismo cliente
# (Kall Díaz). Peor: guardaba la adivinanza en customer_addresses como si fuera
# un hecho y todos los pedidos siguientes heredaban el error.
#
# ─────────────────────────────────────────────────────────────────────────────
# LO ÚNICO QUE HAY QUE REVISAR SON LAS 10 LÍNEAS DE [zona_por_comuna].
# ─────────────────────────────────────────────────────────────────────────────
# Los ~295 barrios de [barrios] son la división oficial de Armenia (10 comunas)
# y no hay que tocarlos. Cada barrio hereda la zona de su comuna; si alguno no
# la sigue, se corrige con una línea en [excepciones] sin tocar nada más.
#
# Tarifas (delivery_zone.rs): norte $6.000 · centro $8.000 · sur $10.000.
#
# Si un barrio NO está en esta tabla, o cae en dos comunas con zonas distintas,
# el bot PREGUNTA "¿norte, centro o sur?" en vez de adivinar. Esa es la parte
# que de verdad arregla el bug; la tabla solo ahorra la pregunta.

# ⚠️ BORRADOR — asignación hecha por geografía de las comunas, sin conocimiento
# del costo real de reparto. Revísalas: cambiar una línea reasigna su comuna
# entera. El único dato confirmado es Granada (comuna 9) = centro.
[zona_por_comuna]
comuna_1  = "norte"   # Centenario
comuna_2  = "sur"   # Rufino José Cuervo
comuna_3  = "sur"   # Alfonso López
comuna_4  = "centro"   # Francisco de Paula Santander
comuna_5  = "centro"   # El Bosque
comuna_6  = "norte"   # San José
comuna_7  = "centro"   # El Cafetero
comuna_8  = "sur"   # Libertadores
comuna_9  = "centro"   # Los Fundadores
comuna_10 = "norte"   # Quimbaya

# Barrios que no siguen la zona de su comuna. Clave = nombre normalizado
# (minúsculas, sin tildes, sin el prefijo "Barrio"/"Conjunto Residencial"/etc).
[excepciones]

