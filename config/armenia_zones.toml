# Barrio de Armenia -> zona de tarifa de domicilio.
#
# norte $6.000 · centro $8.000 · sur $10.000 (tarifas en bot/delivery_zone.rs).
#
# DE DONDE SALE ESTA TABLA
# ────────────────────────
# Las fronteras las definio Samuel por referencias fisicas (2026-09-22):
#   · NORTE  — desde Fundadores hasta Los Geranios, incluyendo el Coliseo del
#              Cafe y la Av. Centenario desde el CC Plaza Flora hacia arriba.
#   · CENTRO — de Plaza Flora / Fundadores / Coliseo del Cafe hacia abajo,
#              hasta el Parque Cafetero, la Estacion del Ferrocarril y
#              Comfenalco El Bosque.
#   · SUR    — de ahi hacia abajo hasta la salida de Armenia (Estadio, Puerto
#              Espejo, Mercar saliendo para Montenegro).
#
# Esas referencias se geocodificaron y se proyectaron sobre el eje principal de
# la ciudad (PCA sobre 451 barrios de OpenStreetMap; Armenia corre en diagonal
# NE-SO, 39.6 grados, asi que un corte por latitud sola clasificaria mal). Las
# tres referencias de cada frontera caen casi en la misma linea, lo que confirma
# que la descripcion era geometricamente coherente:
#   frontera norte/centro = +1.625 m sobre el eje (Plaza Flora 1760, Coliseo
#                           1608, Fundadores 1506)
#   frontera centro/sur   =    +79 m (Comfenalco 439, Ferrocarril 53, Parque
#                           Cafetero -256)
# Verificado contra el unico dato que dio Samuel a mano: Granada = centro (+894).
#
# ATENCION: NO reconstruir esta tabla desde la division por comunas. Se intento
# primero y 6 de las 10 comunas quedaron invertidas — la comuna 1 se llama
# "Centenario" pero esta 100%% al SUR: el nombre viene de la avenida, que
# atraviesa la ciudad entera, no de la ubicacion.
#
# COMO CORREGIR
# ─────────────
# Cada linea es independiente: cambia la zona del barrio que este mal y listo.
# Para que el bot siempre pregunte por un nombre, muevelo a `ambiguos`.
#
# Si un nombre NO esta aca, el bot PREGUNTA "norte, centro o sur?" en vez de
# adivinar. Esa es la garantia real; la tabla solo ahorra la pregunta.

# Nombres que existen en mas de una zona (un conjunto que se llama igual que un
# barrio de otro lado, o un barrio justo sobre la frontera). El bot nunca elige
# por su cuenta entre dos zonas: pregunta.
ambiguos = [
  "bello horizonte", "centenario", "el bosque", "fundadores", "las veraneras", "los andes",
  "piamonte", "san diego", "san jose", "villa de las americas",
]

# 515 barrios. Los marcados # c heredaron la zona de su comuna porque
