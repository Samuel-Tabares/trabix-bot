# Lugares de referencia: lo que la gente da en vez de una direccion ("a Unicentro",
# "al lado del Estadio Centenario"). Se ubicaron en OpenStreetMap (2026-10-30) y se
# proyectaron sobre el mismo eje de arriba, que se recupero de las referencias de
